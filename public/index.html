<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optimized Leaderboard with Service Layer</title>
</head>
<body>
    <form onsubmit="addExpense(event)">
        <input type="text" id="username" placeholder="Your Name" required><br><br>
        <input type="number" id="expenseamount" placeholder="Amount" required><br><br>
        <input type="text" id="description" placeholder="Description" required><br><br>
        <select id="category">
            <option value="fuel">fuel</option>
            <option value="food">food</option>
            <option value="movie">movie</option>
        </select><br><br>
        <button type="submit">Add Expense</button>
    </form>

    <br>
    <button onclick="showLeaderboard()">Show Leaderboard</button>
    <ul id="leaderboardList"></ul>

    <script src="leaderBoard.js"></script>
</body>
</html>
